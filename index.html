<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AJF Goleiros">
<title>AJF Academia de Goleiros</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b10;--bg2:#0f1117;--bg3:#161b22;
  --card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
  --gold:#f59e0b;--gold-dim:rgba(245,158,11,0.12);--gold-border:rgba(245,158,11,0.35);
  --penha:#3b82f6;--penha-dim:rgba(59,130,246,0.12);--penha-b:rgba(59,130,246,0.35);
  --guarulhos:#a78bfa;--guarulhos-dim:rgba(167,139,250,0.12);--guarulhos-b:rgba(167,139,250,0.35);
  --success:#22c55e;--danger:#ef4444;--warn:#f59e0b;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#475569;
}
*{font-family:'Inter',system-ui,sans-serif;box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;}
.page{display:none;}.page.active{display:block;}
#hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,11,16,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,0) 1rem 0;}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;height:58px;}
.logo-wrap{display:flex;align-items:center;gap:0.625rem;}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(245,158,11,0.05));border:1.5px solid var(--gold-border);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.logo-t{font-size:1rem;font-weight:900;color:#fff;letter-spacing:-0.01em;line-height:1;}
.logo-s{font-size:0.6rem;color:var(--gold);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;}
.hdr-btn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s;color:var(--text2);}
.hdr-btn:hover{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold);}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,11,16,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:0.375rem 0 env(safe-area-inset-bottom,0.375rem);display:flex;overflow-x:auto;}
#nav::-webkit-scrollbar{display:none;}
.nav-i{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.35rem .2rem;cursor:pointer;border-radius:10px;margin:0 2px;transition:all .18s;position:relative;color:var(--text3);border:none;background:none;}
.nav-i .ni{font-size:19px;transition:transform .18s;}
.nav-i .nl{font-size:0.58rem;font-weight:600;letter-spacing:.03em;}
.nav-i.active{color:var(--gold);}
.nav-i.active .ni{transform:translateY(-2px) scale(1.15);}
.nav-i.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2.5px;background:var(--gold);border-radius:0 0 4px 4px;box-shadow:0 0 10px rgba(245,158,11,0.8);}
#content{padding-top:calc(58px + env(safe-area-inset-top,0px));padding-bottom:calc(68px + env(safe-area-inset-bottom,0px));min-height:100dvh;}
.pg{padding:1rem;max-width:620px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1rem;}
.card-gold{border-color:var(--gold-border);background:var(--gold-dim);}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.625rem;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:.875rem;}
.stat-v{font-size:1.8rem;font-weight:800;color:#fff;line-height:1;}
.stat-l{font-size:.65rem;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:.2rem;}
.stat-ic{font-size:1.3rem;margin-bottom:.25rem;}
.badge{display:inline-flex;align-items:center;gap:.2rem;padding:.18rem .55rem;border-radius:9999px;font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.bp{background:var(--penha-dim);color:var(--penha);border:1px solid var(--penha-b);}
.bg_{background:var(--guarulhos-dim);color:var(--guarulhos);border:1px solid var(--guarulhos-b);}
.bo{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border);}
.bs{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.3);}
.bd{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.3);}
.bw{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.3);}
.bn{background:rgba(100,116,139,.1);color:#94a3b8;border:1px solid rgba(100,116,139,.25);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.2rem;border-radius:10px;font-size:.875rem;font-weight:600;cursor:pointer;transition:all .15s;border:none;letter-spacing:.01em;}
.btn-g{background:var(--gold);color:#0a0b10;}.btn-g:hover{background:#d97706;}
.btn-o{background:transparent;border:1.5px solid var(--border);color:var(--text2);}.btn-o:hover{border-color:var(--gold-border);color:var(--gold);}
.btn-d{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);}.btn-d:hover{background:rgba(239,68,68,.22);}
.btn-s{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.25);}.btn-s:hover{background:rgba(34,197,94,.22);}
.btn-sm{padding:.35rem .8rem;font-size:.75rem;border-radius:8px;}
.btn-blk{width:100%;}
.fgrp{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.875rem;}
.flbl{font-size:.72rem;color:var(--text2);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.finp{background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:.6rem .875rem;color:var(--text);font-size:.875rem;outline:none;transition:border-color .15s;width:100%;}
.finp:focus{border-color:var(--gold-border);}
.finp::placeholder{color:var(--text3);}
select.finp{cursor:pointer;}
textarea.finp{resize:vertical;min-height:80px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.sec-t{font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;}
.div{height:1px;background:var(--border);margin:1rem 0;}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.875rem;font-weight:700;flex-shrink:0;}
.av-g{background:var(--gold-dim);color:var(--gold);border:1.5px solid var(--gold-border);}
.av-p{background:var(--penha-dim);color:var(--penha);border:1.5px solid var(--penha-b);}
.av-gu{background:var(--guarulhos-dim);color:var(--guarulhos);border:1.5px solid var(--guarulhos-b);}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-110px);background:#1e293b;border:1px solid var(--border);color:#fff;padding:.6rem 1.2rem;border-radius:12px;font-size:.825rem;font-weight:500;z-index:9999;transition:transform .3s ease;white-space:nowrap;max-width:92vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4);}
#toast.show{transform:translateX(-50%) translateY(0);}
.ov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.ov.open{opacity:1;pointer-events:all;}
.sheet{background:var(--bg2);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-width:620px;max-height:90dvh;overflow-y:auto;padding:1.25rem;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.ov.open .sheet{transform:translateY(0);}
.sh-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto .875rem;}
.sh-t{font-size:1rem;font-weight:700;color:#fff;margin-bottom:1rem;}
.tabs{display:flex;gap:.25rem;background:var(--bg2);border-radius:12px;padding:.25rem;margin-bottom:1rem;}
.tab{flex:1;padding:.45rem;border-radius:9px;font-size:.72rem;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text3);transition:all .15s;}
.tab.active{background:var(--card);color:var(--gold);border:1px solid var(--gold-border);}
.adm-tabs{display:flex;overflow-x:auto;gap:.25rem;background:var(--bg2);border-radius:12px;padding:.25rem;margin-bottom:1rem;}
.adm-tabs::-webkit-scrollbar{display:none;}
.adm-tab{flex-shrink:0;padding:.45rem .875rem;border-radius:9px;font-size:.72rem;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text3);transition:all .15s;white-space:nowrap;}
.adm-tab.active{background:var(--card);color:var(--gold);border:1px solid var(--gold-border);}
.sess-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:.875rem;display:flex;align-items:center;gap:.75rem;cursor:pointer;transition:all .18s;margin-bottom:.5rem;}
.sess-card:hover{border-color:var(--gold-border);}
.sess-day{font-size:1.5rem;font-weight:800;color:#fff;line-height:1;}
.sess-mon{font-size:.6rem;color:var(--text2);font-weight:600;text-transform:uppercase;}
.ev-row{display:flex;align-items:center;gap:.625rem;margin-bottom:.75rem;}
.ev-lbl{font-size:.72rem;color:var(--text2);width:105px;flex-shrink:0;font-weight:500;}
.ev-btns{display:flex;gap:2px;flex:1;}
.ev-btn{flex:1;height:26px;border-radius:5px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text3);font-size:.65rem;font-weight:700;cursor:pointer;transition:all .1s;}
.ev-btn:hover{border-color:var(--gold-border);color:var(--gold);}
.ev-btn.sel{background:var(--gold);border-color:var(--gold);color:#000;transform:scale(1.08);}
.ev-sc{width:26px;text-align:right;font-size:.875rem;font-weight:700;color:var(--gold);flex-shrink:0;}
.prod-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:.875rem;display:flex;flex-direction:column;gap:.375rem;}
.qa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.625rem;margin-bottom:1.25rem;}
.qa{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1rem;text-align:center;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:.3rem;}
.qa:hover{border-color:var(--gold-border);transform:translateY(-1px);}
.qa-ic{font-size:1.75rem;}
.qa-lb{font-size:.72rem;font-weight:600;color:var(--text2);}
.alert{border-radius:12px;padding:.75rem 1rem;font-size:.8rem;font-weight:500;line-height:1.4;}
.al-i{background:rgba(59,130,246,.1);color:#93c5fd;border:1px solid rgba(59,130,246,.2);}
.al-w{background:rgba(245,158,11,.1);color:#fcd34d;border:1px solid rgba(245,158,11,.2);}
.al-s{background:rgba(34,197,94,.1);color:#86efac;border:1px solid rgba(34,197,94,.2);}
.al-d{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.2);}
.prog{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-f{height:100%;border-radius:99px;background:var(--gold);transition:width .5s;}
#cart-fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));right:1rem;z-index:90;width:54px;height:54px;border-radius:16px;background:var(--gold);color:#0a0b10;font-size:1.25rem;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(245,158,11,.45);font-weight:700;transition:all .2s;flex-direction:column;gap:1px;}
#cart-fab.vis{display:flex;}
#cart-fab-ct{font-size:.65rem;font-weight:800;}
.score-cir{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:var(--gold);background:var(--gold-dim);flex-shrink:0;}
.emp{text-align:center;padding:3rem 1rem;}
.emp-ic{font-size:3rem;margin-bottom:.75rem;}
.emp-t{font-size:.875rem;font-weight:600;color:var(--text2);margin-bottom:.35rem;}
.emp-s{font-size:.75rem;color:var(--text3);}
.ath-row{display:flex;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border);}
.ath-row:last-child{border-bottom:none;}
.upl-area{border:2px dashed var(--border);border-radius:12px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;}
.upl-area:hover{border-color:var(--gold-border);background:var(--gold-dim);}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:pointer;}
.rank-row{display:flex;align-items:center;gap:.625rem;padding:.6rem .75rem;background:var(--bg2);border-radius:12px;margin-bottom:.375rem;}
.fin-row{display:flex;align-items:center;gap:.625rem;padding:.75rem;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:.375rem;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .25s ease forwards;}
.t-main{color:#f1f5f9 !important;}.t-sub{color:#94a3b8 !important;}.t-gold{color:#f59e0b !important;}
#splash{position:fixed;inset:0;z-index:9000;background:#0a0b10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;transition:opacity .6s ease;}
#splash.out{opacity:0;pointer-events:none;}
#splash-logo{width:170px;height:170px;object-fit:contain;}
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 20px rgba(245,158,11,.3))}50%{filter:drop-shadow(0 0 50px rgba(245,158,11,.8))}}
#splash-logo{animation:pulseGlow 2s ease-in-out infinite;}
.sp-t{font-size:.65rem;color:var(--gold);font-weight:700;letter-spacing:.2em;text-transform:uppercase;}
.sp-sub{font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:-.02em;}
.hdr-logo-img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(245,158,11,.5));}
.pg-logo-bar{display:flex;align-items:center;gap:.75rem;padding:.625rem .875rem;background:linear-gradient(90deg,rgba(245,158,11,.1),transparent);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;margin-bottom:1.25rem;}
.pg-logo-bar img{width:36px;height:36px;object-fit:contain;}
.pg-bar-t{font-size:.6rem;color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1;}
.pg-bar-n{font-size:.825rem;font-weight:800;color:#fff;line-height:1.2;}
.atleta-chip{display:flex;align-items:center;gap:.5rem;padding:.5rem .625rem;background:var(--bg2);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;}
.atleta-chip:hover,.atleta-chip:active{border-color:var(--gold-border);background:var(--gold-dim);}
.atleta-chip.sel{border-color:var(--gold-border);background:var(--gold-dim);}
/* Confirmar page */
.conf-sess{background:var(--bg2);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:1rem;}
.conf-banner{background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(245,158,11,.04));padding:1.25rem;border-bottom:1px solid var(--border);}
.conf-date-box{display:flex;align-items:center;gap:.875rem;}
.conf-day-num{font-size:2.5rem;font-weight:900;color:#fff;line-height:1;}
.conf-day-info{flex:1;}
.conf-weekday{font-size:1rem;font-weight:700;color:#fff;}
.conf-time{font-size:.875rem;color:var(--gold);font-weight:600;}
.conf-body{padding:1rem;}
.addr-card{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:14px;padding:.875rem;margin-bottom:1rem;}
.addr-lbl{font-size:.6rem;color:var(--penha);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.35rem;}
.addr-txt{font-size:.825rem;color:#f1f5f9;font-weight:500;line-height:1.55;}
.maps-btn{display:inline-flex;align-items:center;gap:.4rem;margin-top:.625rem;padding:.4rem .875rem;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);border-radius:8px;color:var(--penha);font-size:.75rem;font-weight:600;text-decoration:none;transition:all .15s;}
.maps-btn:hover{background:rgba(59,130,246,.25);}
.conf-count{font-size:.75rem;color:var(--text2);margin-bottom:.75rem;display:flex;align-items:center;gap:.4rem;}
/* Share banner */
.share-box{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(245,158,11,.03));border:1.5px solid var(--gold-border);border-radius:16px;padding:1rem;margin-bottom:1.25rem;text-align:center;}
/* Pagar (payment public page) */
.pix-box{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(245,158,11,.04));border:2px solid var(--gold-border);border-radius:18px;padding:1.5rem;text-align:center;margin-bottom:1.25rem;}
.pix-key{font-size:1.6rem;font-weight:900;color:var(--gold);letter-spacing:.04em;word-break:break-all;margin:.5rem 0;}
.pix-label{font-size:.62rem;color:var(--text2);font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.valor-big{font-size:2.5rem;font-weight:900;color:#fff;line-height:1;}
.valor-lbl{font-size:.62rem;color:var(--text2);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.25rem;}

</style>
</head>
<body>
<div id="toast"></div>
<div id="splash"><img id="splash-logo" src="" alt="AJF"><div class="sp-sub">AJF Academia</div><div class="sp-t">Academia de Goleiros</div></div>

<header id="hdr">
  <div class="hdr-inner">
    <div class="logo-wrap">
      <img id="hdr-logo" class="hdr-logo-img" src="" alt="AJF">
      <div>
        <div class="logo-t">AJF Academia</div>
        <div class="logo-s">Academia de Goleiros</div>
      </div>
    </div>
    <div style="display:flex;gap:.4rem">
      <button class="hdr-btn" onclick="goTo('treinadores')" title="Treinadores">👥</button>
      <button class="hdr-btn" onclick="goTo('admin')" title="Admin">⚙️</button>
    </div>
  </div>
</header>

<main id="content">
  <div id="page-inicio" class="page active"><div class="pg" id="ci"></div></div>
  <div id="page-presenca" class="page"><div class="pg" id="cp"></div></div>
  <div id="page-avaliacao" class="page"><div class="pg" id="ca"></div></div>
  <div id="page-financeiro" class="page"><div class="pg" id="cf"></div></div>
  <div id="page-loja" class="page"><div class="pg" id="cl"></div></div>
  <div id="page-treinadores" class="page"><div class="pg" id="ct"></div></div>
  <div id="page-admin" class="page"><div class="pg" id="cdm"></div></div>
  <div id="page-confirmar" class="page"><div class="pg" id="cconf"></div></div>
  <div id="page-pagar" class="page"><div class="pg" id="cpag"></div></div>
</main>

<nav id="nav">
  <button class="nav-i active" data-p="inicio" onclick="goTo('inicio')"><span class="ni">🏠</span><span class="nl">Início</span></button>
  <button class="nav-i" data-p="presenca" onclick="goTo('presenca')"><span class="ni">📋</span><span class="nl">Presença</span></button>
  <button class="nav-i" data-p="avaliacao" onclick="goTo('avaliacao')"><span class="ni">⭐</span><span class="nl">Avaliação</span></button>
  <button class="nav-i" data-p="financeiro" onclick="goTo('financeiro')"><span class="ni">💰</span><span class="nl">Financeiro</span></button>
  <button class="nav-i" data-p="loja" onclick="goTo('loja')"><span class="ni">🛒</span><span class="nl">Loja</span></button>
</nav>

<div id="cart-fab" onclick="openCart()">🛒<span id="cart-fab-ct">0</span></div>

<!-- Admin PIN modal -->
<div class="ov" id="ov-pin">
  <div class="sheet" style="max-height:60dvh">
    <div class="sh-handle"></div>
    <div class="sh-t">🔐 Acesso Administrativo</div>
    <div class="fgrp">
      <label class="flbl">PIN do Administrador</label>
      <input class="finp" id="pin-inp" type="password" placeholder="Digite o PIN" maxlength="20" onkeydown="if(event.key==='Enter')checkPin()">
    </div>
    <div id="pin-err" style="color:#ef4444;font-size:.75rem;margin-bottom:.75rem;display:none">PIN incorreto. Tente novamente.</div>
    <button class="btn btn-g btn-blk" onclick="checkPin()">Entrar</button>
    <button class="btn btn-o btn-blk" style="margin-top:.5rem" onclick="closeOv('ov-pin')">Cancelar</button>
  </div>
</div>

<!-- Confirm presence modal -->
<div class="ov" id="ov-presenca">
  <div class="sheet" style="max-height:92dvh">
    <div class="sh-handle"></div>
    <div class="sh-t" id="ov-presenca-t">Confirmar Presença</div>
    <div id="ov-presenca-body"></div>
  </div>
</div>

<!-- Cart modal -->
<div class="ov" id="ov-cart">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-t">🛒 Carrinho</div>
    <div id="cart-items"></div>
    <div class="div"></div>
    <div id="cart-total" style="font-size:1rem;font-weight:700;color:#fff;margin-bottom:1rem"></div>
    <div class="fgrp">
      <label class="flbl">Seu nome</label>
      <input class="finp" id="cart-nome" type="text" placeholder="Nome completo" maxlength="60">
    </div>
    <div class="fgrp">
      <label class="flbl">Forma de pagamento</label>
      <select class="finp" id="cart-pgto">
        <option value="pix">Pix</option>
        <option value="dinheiro">Dinheiro</option>
        <option value="cartao">Cartão</option>
      </select>
    </div>
    <div id="cart-pix-area" style="margin-bottom:.875rem">
      <div class="alert al-i" style="margin-bottom:.5rem">📱 Chave Pix: <strong>ajfacademia@pix.com</strong></div>
      <label class="flbl" style="margin-bottom:.35rem;display:block">Comprovante Pix</label>
      <input type="file" id="cart-comp" accept="image/*" style="display:none" onchange="previewFile('cart-comp','cart-comp-prev')">
      <div class="upl-area" onclick="document.getElementById('cart-comp').click()">
        <div style="font-size:1.5rem;margin-bottom:.35rem">📄</div>
        <div style="font-size:.75rem;color:var(--text2)">Toque para anexar comprovante</div>
      </div>
      <img id="cart-comp-prev" style="display:none;width:100%;border-radius:10px;margin-top:.5rem;object-fit:cover;max-height:180px">
    </div>
    <button class="btn btn-g btn-blk" onclick="finalizarPedido()">Finalizar Pedido</button>
    <button class="btn btn-o btn-blk" style="margin-top:.5rem" onclick="closeOv('ov-cart')">Fechar</button>
  </div>
</div>

<!-- Payment modal -->
<div class="ov" id="ov-pag">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-t" id="ov-pag-t">Registrar Pagamento</div>
    <div class="fgrp">
      <label class="flbl">Valor (R$)</label>
      <input class="finp" id="pag-val" type="number" placeholder="150.00" min="0" step="0.01">
    </div>
    <div class="fgrp">
      <label class="flbl">Observações</label>
      <input class="finp" id="pag-obs" type="text" placeholder="Opcional" maxlength="100">
    </div>
    <div class="fgrp">
      <label class="flbl">Comprovante (opcional)</label>
      <input type="file" id="pag-comp" accept="image/*" style="display:none" onchange="previewFile('pag-comp','pag-comp-prev')">
      <div class="upl-area" onclick="document.getElementById('pag-comp').click()">
        <div style="font-size:1.5rem;margin-bottom:.35rem">📄</div>
        <div style="font-size:.75rem;color:var(--text2)">Toque para anexar comprovante</div>
      </div>
      <img id="pag-comp-prev" style="display:none;width:100%;border-radius:10px;margin-top:.5rem;object-fit:cover;max-height:180px">
    </div>
    <button class="btn btn-g btn-blk" onclick="salvarPagamento()">💾 Salvar Pagamento</button>
    <button class="btn btn-o btn-blk" style="margin-top:.5rem" onclick="closeOv('ov-pag')">Cancelar</button>
  </div>
</div>

<!-- Image viewer -->
<div class="ov" id="ov-img" onclick="closeOv('ov-img')">

function compressImage(file,maxW=900,q=0.72){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

  const f=document.getElementById(inputId).files[0];
  if(!f)return;
  compressImage(f).then(b64=>{
    const el=document.getElementById(prevId);
    el.src=b64;
    el.style.display='block';
    el._b64=b64;
  });
}

function viewImage(src){
  document.getElementById('ov-img-el').src=src;
  openOv('ov-img');
}

// ── Navigation ─────────────────────────────────────
function goTo(page){
  if(page==='admin'&&!adminAuth){pinTarget='admin';openOv('ov-pin');document.getElementById('pin-inp').value='';document.getElementById('pin-err').style.display='none';return;}
  if(page==='financeiro'&&!adminAuth){pinTarget='financeiro';openOv('ov-pin');document.getElementById('pin-inp').value='';document.getElementById('pin-err').style.display='none';return;}
  const pageEl=document.getElementById('page-'+page);
  if(!pageEl)return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  pageEl.classList.add('active');
  document.querySelectorAll('.nav-i').forEach(b=>{b.classList.toggle('active',b.dataset.p===page);});
  curPage=page;
  location.hash=(page==='pagar'&&pagarAtletaId)?'pagar/'+pagarAtletaId:page;
  render(page);
}

function render(page){
  if(page==='inicio')renderInicio();
  else if(page==='presenca')renderPresenca();
  else if(page==='avaliacao')renderAvaliacao();
  else if(page==='financeiro')renderFinanceiro();
  else if(page==='loja')renderLoja();
  else if(page==='treinadores')renderTreinadores();
  else if(page==='confirmar')renderConfirmar();
  else if(page==='pagar')renderPagar();
  else if(page==='admin')renderAdmin();
}

// ── PIN ───────────────────────────────────────────
function checkPin(){
  const pin=(document.getElementById('pin-inp').value||'').trim();
  const cfg=S.config||{};
  const correct=cfg.adminPin||'ajf2024';
  if(pin===correct){
    adminAuth=true;
    closeOv('ov-pin');
    goTo(pinTarget||'admin');
  }else{
    document.getElementById('pin-err').style.display='block';
  }
}

function selecionarAtleta(id,nome){
  _presAtletaId=id;
  document.getElementById('pres-nome').value=nome;
  document.getElementById('pres-search').value=nome;
  document.querySelectorAll('.atleta-chip').forEach(c=>{
    c.classList.toggle('sel',c.querySelector('span')?.textContent===nome);
  });
}

function filtrarAtletas(q){
  const s=S.sessoes[activeSessId];
  const filtered=_presAtletas.filter(([,a])=>!q||(a.nome||'').toLowerCase().includes(q.toLowerCase()));
  const avCls=s?.local==='penha'?'av-p':'av-gu';
  document.getElementById('pres-lista').innerHTML=filtered.length===0
    ?'<div style="font-size:.75rem;color:var(--text3);text-align:center;padding:.625rem">Nenhum resultado</div>'
    :filtered.map(([id,a])=>'<div class="atleta-chip" onclick="selecionarAtleta(\''+id+'\',\''+a.nome.replace(/'/g,"\\'")+'\')">'
      +'<div class="av '+avCls+'" style="width:30px;height:30px;font-size:.65rem;flex-shrink:0">'+initials(a.nome)+'</div>'
      +'<span class="t-main" style="font-size:.825rem;font-weight:500">'+a.nome+'</span>'
      +'</div>').join('');
}

function confirmarPresenca(){
  const nome=(document.getElementById('pres-nome').value||'').trim();
  if(!nome){showToast('Digite ou selecione seu nome.','err');return;}
  if(!activeSessId){showToast('Sessão não selecionada.','err');return;}
  const s=S.sessoes[activeSessId];
  if(s&&s.data<today()){showToast('Esta sessão já aconteceu.','err');return;}
  const tel=(document.getElementById('pres-tel').value||'').trim();
  // Resolve athlete ID — from selection or name match
  let atletaId=(_presAtletaId&&_presAtletaId!=='undefined')?_presAtletaId:null;
  if(!atletaId){
    const match=Object.entries(S.atletas).find(([,a])=>a.ativo!==false&&(a.nome||'').toLowerCase()===nome.toLowerCase());
    if(match)atletaId=match[0];
  }
  const presId=uid();
  db.ref('ajf/presencas/'+activeSessId+'/'+presId).set({nome,tel,atletaId:atletaId||null,ts:Date.now()}).then(()=>{
    showToast('✓ Presença confirmada!','ok');
    closeOv('ov-presenca');
    _presAtletaId='';
    // Auto-create R$40 session payment if athlete is registered
    if(atletaId&&S.atletas[atletaId]){
      const now=new Date();
      const pagKey=uid();
      db.ref('ajf/pagamentos/'+pagKey).set({
        atletaId,atletaNome:nome,
        mes:now.getMonth()+1,ano:now.getFullYear(),
        valor:40,pago:false,pendente:true,
        tipo:'treino',sessaoId:activeSessId,
        ts:Date.now()
      });
    }
  });
}

function removerPresenca(sessId,confId){
  if(!confirm('Remover esta confirmação?'))return;
  db.ref('ajf/presencas/'+sessId+'/'+confId).remove().then(()=>showToast('Removido.'));
}

let avalSessId=null, avalAtl=null;
function renderAvaliacao(){

    content+='<div class="alert al-i" style="margin-bottom:1rem">Selecione uma sessão para avaliar os atletas presentes.</div>'
    +(sessoes.length===0
      ?'<div class="emp"><div class="emp-ic">⭐</div><div class="emp-t">Nenhuma sessão disponível</div><div class="emp-s">Sessões aparecerão após a data de realização.</div></div>'
      :sessoes.map(([id,s])=>{
        const d=new Date(s.data+'T12:00:00');
        const conf=S.presencas[id]?Object.keys(S.presencas[id]).length:0;
        return '<div class="sess-card" onclick="avalSessId=\''+id+'\';avalAtl=null;renderAvaliacao()">'
          +'<div style="text-align:center;width:44px;flex-shrink:0"><div class="sess-day">'+d.getDate()+'</div><div class="sess-mon">'+MONS[d.getMonth()]+'</div></div>'
          +'<div style="flex:1"><div style="font-size:.875rem;font-weight:600;color:#fff">'+(s.hora||'Treino')+' — '+DIAS[d.getDay()]+'</div>'
          +'<div style="font-size:.7rem;color:var(--text2);margin-top:2px"><span class="badge '+(s.local==='penha'?'bp':'bg_')+'">'+locLabel(s.local)+'</span>&nbsp;'+conf+' confirmados</div></div>'
          +'<div style="color:var(--text3);font-size:1.2rem">›</div></div>';
      }).join(''));
  } else {
    const s=S.sessoes[avalSessId];
    const d=new Date(s.data+'T12:00:00');
    const confs=Object.entries(S.presencas[avalSessId]||{});
    const sessAvals=S.avaliacoes[avalSessId]||{};
    content+='<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem">'
      +'<button class="btn btn-sm btn-o" onclick="avalSessId=null;avalAtl=null;renderAvaliacao()">← Voltar</button>'
      +'<div><div style="font-size:.875rem;font-weight:700;color:#fff">'+(s.hora||'Treino')+' — '+DIAS[d.getDay()]+', '+fmt(s.data)+'</div>'
      +'<span class="badge '+(s.local==='penha'?'bp':'bg_')+'">'+locLabel(s.local)+'</span></div>'
      +'</div>'
      +(confs.length===0
        ?'<div class="alert al-w">Nenhum atleta confirmou presença nesta sessão. Você ainda pode avaliar digitando o nome.</div>'
        :'')
      +'<div class="sec-t" style="margin-bottom:.625rem">Atletas Confirmados</div>'
      +confs.map(([cid,c])=>{
        const aval=sessAvals[cid];
        const nota=aval?calcNota(aval):null;
        return '<div class="ath-row" style="cursor:pointer" onclick="abrirAvaliacao(\''+avalSessId+'\',\''+cid+'\',\''+c.nome+'\')">'
          +'<div class="av av-g">'+initials(c.nome)+'</div>'
          +'<div style="flex:1"><div style="font-size:.875rem;font-weight:600;color:#fff">'+c.nome+'</div>'

          +'</div>'
          +(nota!==null?'<div class="score-cir" style="width:44px;height:44px;font-size:.9rem">'+nota+'</div>':'<div style="color:var(--gold);font-size:1rem">›</div>')
          +'</div>';
      }).join('')
      +'<div class="div"></div>'
      +'<div class="sec-t" style="margin-bottom:.625rem">Avaliar por nome</div>'
      +'<div style="display:flex;gap:.5rem">'
      +'<input class="finp" id="avl-free-nm" type="text" placeholder="Nome do goleiro" style="flex:1">'
      +'<button class="btn btn-g" onclick="avaliarLivre()">Avaliar</button>'
      +'</div>';

    // Rankings for this session
    const rankEntries=Object.entries(sessAvals).map(([cid,av])=>{
      const nm=S.presencas[avalSessId]?.[cid]?.nome||cid;
      return {cid,nm,nota:calcNota(av)};
    }).sort((a,b)=>b.nota-a.nota);
    if(rankEntries.length>0){
      content+='<div class="sec-hdr" style="margin-top:1rem"><span class="sec-t">Ranking da Sessão</span></div>'
        +rankEntries.map((r,i)=>'<div class="rank-row"><div style="width:22px;font-size:.875rem;font-weight:800;color:'+(i===0?'var(--gold)':i===1?'#94a3b8':i===2?'#cd7f32':'var(--text3))')+'">'+(i+1)+'</div><div class="av av-g" style="width:34px;height:34px;font-size:.75rem">'+initials(r.nm)+'</div><div style="flex:1;font-size:.875rem;color:#fff">'+r.nm+'</div><div class="score-cir" style="width:40px;height:40px;font-size:.85rem">'+r.nota+'</div></div>').join('');
    }
  }
  content+='</div>';
  el.innerHTML=content;
}

function calcNota(av){
  const vals=EVAL_CRIT.map(c=>Number(av[c.k]||0)).filter(v=>v>0);
  if(!vals.length)return 0;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10);
}

function abrirAvaliacao(sessId,atletaId,nome){

  document.getElementById('ov-eval-t').textContent='Avaliar: '+nome;

    for(let i=1;i<=10;i++){

function setEval(k,v){
  evalData[k]=evalData[k]===v?0:v;
  document.querySelectorAll('[id^="ev-'+k+'-"]').forEach(b=>{
    const n=parseInt(b.id.split('-').pop());

  const notaEl=document.getElementById('ev-nota-display');
  if(notaEl)notaEl.textContent=calcNota(evalData)+'/100';

function _buildTreinoPorAtl(mes,ano){
  const porKey={};

  // 1. Payment records already saved
  Object.entries(S.pagamentos).forEach(([pid,p])=>{
    if(p.tipo!=='treino'||p.mes!=mes||p.ano!=ano)return;
    const at=p.atletaId?S.atletas[p.atletaId]:null;
    const key=p.atletaId||(p.atletaNome?'n:'+p.atletaNome.toLowerCase():null);
    if(!key)return;
    if(!porKey[key])porKey[key]={atletaId:p.atletaId||null,nome:p.atletaNome||at?.nome||'—',local:at?.local||'',pags:[],pendente:0,pago:0};
    porKey[key].pags.push({...p,id:pid});
    if(p.pago)porKey[key].pago+=Number(p.valor||0);
    else porKey[key].pendente+=Number(p.valor||0);
  });

  // 2. Scan presences of sessions this month — find confirmed athletes with no payment yet
  const mesStr=String(mes).padStart(2,'0');
  Object.entries(S.sessoes).forEach(([sessId,s])=>{
    if(!s.data||!s.data.startsWith(ano+'-'+mesStr))return;
    Object.entries(S.presencas[sessId]||{}).forEach(([,c])=>{
      if(!c.nome)return;
      // Resolve athlete ID from record or by name match
      let atletaId=c.atletaId||null;
      if(!atletaId){
        const m=Object.entries(S.atletas).find(([,a])=>a.ativo!==false&&(a.nome||'').toLowerCase()===(c.nome||'').toLowerCase());
        if(m)atletaId=m[0];
      }
      const key=atletaId||('n:'+c.nome.toLowerCase());
      if(porKey[key])return; // already has payment record
      const at=atletaId?S.atletas[atletaId]:null;
      porKey[key]={atletaId,nome:at?.nome||c.nome,local:at?.local||'',pags:[],pendente:40,pago:0,fromPresenca:true};
    });
  });

  return Object.entries(porKey).sort((a,b)=>a[1].nome.localeCompare(b[1].nome));
}

function _mkTreinoRow([key,e]){
  const atletaId=e.atletaId;
  const pendSess=e.fromPresenca?1:e.pags.filter(p=>!p.pago).length;
  const pagoSess=e.fromPresenca?0:e.pags.filter(p=>p.pago).length;
  const primPend=e.fromPresenca?null:e.pags.find(p=>!p.pago);
  const avCls=e.local==='penha'?'av-p':e.local==='guarulhos'?'av-gu':'av-g';
  const nomeEsc=e.nome.replace(/'/g,"\\'");
  const now=new Date();
  return '<div class="fin-row">'
    +'<div class="av '+avCls+'">'+initials(e.nome)+'</div>'
    +'<div style="flex:1">'
    +'<div style="font-size:.875rem;font-weight:600;color:#fff">'+e.nome+'</div>'
    +'<div style="font-size:.72rem;margin-top:3px">'
    +(e.pendente>0?'<span style="color:var(--danger);font-weight:600">'+pendSess+' sessão'+(pendSess>1?'ões':'')+' · '+fmtMoney(e.pendente)+'</span>':'')
    +(e.pendente>0&&e.pago>0?'&nbsp;&nbsp;':'')
    +(e.pago>0?'<span style="color:var(--success)">✓ '+fmtMoney(e.pago)+' pago</span>':'')
    +(!atletaId?'&nbsp;<button class="badge bn" style="cursor:pointer;border:none;text-decoration:underline;text-underline-offset:2px" onclick="cadastrarDaPresenca(\''+nomeEsc+'\')" title="Clique para cadastrar">+ Cadastrar</button>':'')
    +'</div></div>'
    +'<div style="display:flex;gap:.35rem">'
    +'<button class="btn btn-sm btn-o" title="Enviar cobrança via WhatsApp" onclick="abrirWhatsAppPagamento('+(atletaId?'\''+atletaId+'\'':'null')+',\''+nomeEsc+'\')">📲</button>'
    +(e.fromPresenca?'<button class="btn btn-sm btn-s" onclick="criarPagPresenca('+(atletaId?'\''+atletaId+'\'':'null')+',\''+nomeEsc+'\',\''+e.local+'\','+(now.getMonth()+1)+','+now.getFullYear()+')">✓ Pago</button>':'')
    +(primPend?'<button class="btn btn-sm btn-s" onclick="confirmarPagamento(\''+primPend.id+'\')">✓ Pago</button>':'')
    +'</div></div>';
}

function _renderTreinoLista(entradas){
  if(entradas.length===0)return'<div class="emp"><div class="emp-ic">📋</div><div class="emp-t">Nenhuma cobrança este mês</div><div class="emp-s">As cobranças aparecem quando os goleiros confirmam presença nas sessões.</div></div>';
  const penha=entradas.filter(([,e])=>e.local==='penha');
  const guar=entradas.filter(([,e])=>e.local==='guarulhos');
  const outros=entradas.filter(([,e])=>e.local!=='penha'&&e.local!=='guarulhos');
  const pendPenha=penha.filter(([,e])=>e.pendente>0).length;
  const pendGuar=guar.filter(([,e])=>e.pendente>0).length;
  const pendOutros=outros.filter(([,e])=>e.pendente>0).length;
  const grp=(list,cor,label,pendN,top)=>{
    if(!list.length)return'';
    return'<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.625rem;margin-top:'+(top?'1.25rem':'.25rem')+'">'
      +(cor?'<span style="width:10px;height:10px;border-radius:50%;background:'+cor+';display:inline-block;flex-shrink:0"></span>':'')
      +'<span style="font-size:.72rem;font-weight:700;color:'+(cor||'var(--text2)')+';text-transform:uppercase;letter-spacing:.08em">'+label+'</span>'
      +(pendN>0?'<span class="badge bd">'+pendN+' pendente'+(pendN>1?'s':'')+'</span>':'<span class="badge bs">Em dia</span>')
      +'</div>'+list.map(_mkTreinoRow).join('');
  };
  return grp(penha,'var(--penha)','Penha',pendPenha,false)
    +grp(guar,'var(--guarulhos)','Guarulhos',pendGuar,penha.length>0)
    +grp(outros,'','Sem local definido',pendOutros,penha.length>0||guar.length>0);
}

             :'<button class="btn btn-g btn-sm btn-blk" onclick="addCart(\''+id+'\')">+ Adicionar</button>')
           +'</div>';
       }).join('')+'</div>'
    )+'</div>';
  el.innerHTML=html;
  updateCartFab();
}

function addCart(prodId){
  const p=S.produtos[prodId];
  if(!p)return;
  cart[prodId]={nome:p.nome,preco:p.preco,emoji:p.emoji||'📦',qty:(cart[prodId]?.qty||0)+1};
  updateCartFab();
  showToast('✓ Adicionado ao carrinho!','ok');
}

function updateCartFab(){
  const total=Object.values(cart).reduce((a,i)=>a+i.qty,0);
  const fab=document.getElementById('cart-fab');
  document.getElementById('cart-fab-ct').textContent=total;
  fab.classList.toggle('vis',total>0);
}

function openCart(){
  if(!Object.keys(cart).length){showToast('Carrinho vazio.','err');return;}
  const items=Object.entries(cart);
  const totalVal=items.reduce((a,[,i])=>a+i.preco*i.qty,0);
  document.getElementById('cart-items').innerHTML=items.map(([id,i])=>
    '<div style="display:flex;align-items:center;gap:.625rem;padding:.5rem 0;border-bottom:1px solid var(--border)">'
    +'<div style="font-size:1.5rem">'+i.emoji+'</div>'
    +'<div style="flex:1"><div style="font-size:.875rem;font-weight:600;color:#fff">'+i.nome+'</div>'
    +'<div style="font-size:.75rem;color:var(--gold)">'+fmtMoney(i.preco)+' × '+i.qty+'</div></div>'
    +'<div style="display:flex;align-items:center;gap:.25rem">'
    +'<button class="btn btn-sm btn-d" style="width:26px;height:26px;padding:0" onclick="changeQty(\''+id+'\',-1)">−</button>'
    +'<span style="font-size:.875rem;font-weight:700;color:#fff;min-width:20px;text-align:center">'+i.qty+'</span>'
    +'<button class="btn btn-sm btn-o" style="width:26px;height:26px;padding:0" onclick="changeQty(\''+id+'\',1)">+</button>'
    +'</div></div>'
  ).join('');
  document.getElementById('cart-total').innerHTML='Total: <span style="color:var(--gold)">'+fmtMoney(totalVal)+'</span>';
  const pm=document.getElementById('cart-pgto').value;
  document.getElementById('cart-pix-area').style.display=pm==='pix'?'block':'none';
  document.getElementById('cart-nome').value='';
  document.getElementById('cart-comp').value='';
  document.getElementById('cart-comp-prev').style.display='none';
  openOv('ov-cart');
}

document.addEventListener('change',e=>{
  if(e.target.id==='cart-pgto'){
    document.getElementById('cart-pix-area').style.display=e.target.value==='pix'?'block':'none';
  }
});

function changeQty(prodId,delta){
  if(!cart[prodId])return;
  cart[prodId].qty+=delta;
  if(cart[prodId].qty<=0)delete cart[prodId];
  updateCartFab();
  if(!Object.keys(cart).length){closeOv('ov-cart');return;}
  openCart();
  closeOv('ov-cart');
  setTimeout(()=>openCart(),50);
}

function finalizarPedido(){
  const nome=(document.getElementById('cart-nome').value||'').trim();
  if(!nome){showToast('Digite seu nome.','err');return;}
  const pgto=document.getElementById('cart-pgto').value;
  const prev=document.getElementById('cart-comp-prev');
  const comp=prev._b64||null;
  if(pgto==='pix'&&!comp){showToast('Anexe o comprovante Pix.','err');return;}
  const itens=Object.entries(cart).map(([pid,i])=>({produtoId:pid,nome:i.nome,qty:i.qty,preco:i.preco}));
  const total=itens.reduce((a,i)=>a+i.preco*i.qty,0);
  const payload={atletaNome:nome,itens,total,pagto,status:'pendente',data:today(),ts:Date.now()};
  if(comp)payload.comprovante=comp;
  db.ref('ajf/pedidos/'+uid()).set(payload).then(()=>{
    cart={};
    updateCartFab();
    showToast('✓ Pedido realizado! Aguarde confirmação.','ok');
    closeOv('ov-cart');
    prev._b64=null;
  });
}

function enviarComprovantePagamento(){
  const at=pagarAtletaId?S.atletas[pagarAtletaId]:null;
  if(!at){showToast('Atleta não encontrado.','err');return;}
  const prev=document.getElementById('pag-pub-prev');
  const comp=prev?prev._b64:null;
  if(!comp){showToast('Selecione o comprovante primeiro.','err');return;}
  const now=new Date();
  const mes=now.getMonth()+1,ano=now.getFullYear();
  const key=uid();
  const payload={atletaId:pagarAtletaId,atletaNome:at.nome,mes,ano,valor:40,pago:false,pendente:true,comprovante:comp,tipo:'mensalidade',ts:Date.now()};
  db.ref('ajf/pagamentos/'+key).set(payload,function(err){
    if(err){showToast('Erro ao enviar. Tente novamente.','err');return;}
    showToast('✅ Comprovante enviado! Aguarde confirmação.','ok');
    if(prev){prev._b64=null;prev.src='';document.getElementById('pag-pub-prev-wrap').style.display='none';}
    const fi=document.getElementById('pag-pub-file');if(fi)fi.value='';
  });

function salvarConfig(){
  const pin=(document.getElementById('cfg-pin')?.value||'').trim();
  const mens=parseFloat(document.getElementById('cfg-mens')?.value)||150;
  const endG=(document.getElementById('cfg-end-g')?.value||'').trim();
  const endP=(document.getElementById('cfg-end-p')?.value||'').trim();
  const update={mensalidadeValor:mens};
  if(pin)update.adminPin=pin;
  if(endG)update.enderecoGuarulhos=endG;
  if(endP)update.enderecoPenha=endP;
  db.ref('ajf/config').update(update).then(()=>showToast('✓ Configurações salvas!','ok'));
}

// ── SEED ───────────────────────────────────────────
async function seedIfEmpty(){
  const snap=await db.ref('ajf/config').once('value');
  if(!snap.exists()){
    await db.ref('ajf/config').set({adminPin:'ajf2024',mensalidadeValor:150});
  }
  const prodSnap=await db.ref('ajf/produtos').once('value');
  if(!prodSnap.exists()){
    const prods={
      [uid()]:{nome:'Luva de Goleiro Pro',descricao:'Palma em látex alemão, corte negativo',preco:189.90,estoque:8,ativo:true,emoji:'🧤'},
      [uid()]:{nome:'Luva Iniciante',descricao:'Ideal para treinos iniciais',preco:89.90,estoque:12,ativo:true,emoji:'🧤'},
      [uid()]:{nome:'Camiseta Térmica AJF',descricao:'Compressão com proteção UV, logo AJF',preco:94.90,estoque:15,ativo:true,emoji:'👕'},
      [uid()]:{nome:'Shorts de Treino',descricao:'Com proteção lateral acolchoada',preco:74.90,estoque:10,ativo:true,emoji:'🩳'},
      [uid()]:{nome:'Kit Goleiro Completo',descricao:'Luva Pro + Camiseta Térmica + Shorts',preco:329.90,estoque:5,ativo:true,emoji:'🎁'},
      [uid()]:{nome:'Joelheira Proteção',descricao:'Espuma EVA, ideal para treinos de queda',preco:49.90,estoque:20,ativo:true,emoji:'🦵'},
    };
    await db.ref('ajf/produtos').set(prods);
  }
}

// ── INIT ───────────────────────────────────────────
(async function init(){
  applyLogo();
  await seedIfEmpty();
  db.ref('ajf').on('value',snap=>{
    const d=snap.val()||{};
    S.atletas=d.atletas||{};
    S.sessoes=d.sessoes||{};
    S.presencas=d.presencas||{};
    S.avaliacoes=d.avaliacoes||{};
    S.pagamentos=d.pagamentos||{};
    S.pedidos=d.pedidos||{};
    S.produtos=d.produtos||{};
    S.treinadores=d.treinadores||{};
    S.config=d.config||{};
    render(curPage);
    if(curPage==='loja')updateCartFab();
  });
  const PUBLIC_PAGES=new Set(['inicio','presenca','avaliacao','loja','treinadores','confirmar','pagar']);
  const hashRaw=(location.hash||'').slice(1);
  const hashParts=hashRaw.split('/');
  const hashPage=(hashParts[0]||'').toLowerCase();
  if(hashPage==='pagar'&&hashParts[1])pagarAtletaId=hashParts[1];
  const startPage=PUBLIC_PAGES.has(hashPage)?hashPage:'inicio';
  goTo(startPage);
  setTimeout(hideSplash,1800);
})();
</script>
